<html lang="en">
<head>
<meta charset="UTF-8">

<title>Nainx JS Lab – Node, Express, React, TypeScript and more</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110d22;--pn:#1a1433;--pn2:#251d47;--ln:#3a2f66;--tx:#eee9ff;--mu:#a79fce;--ac:#a98bff;--ac2:#ff6fb5;--cd:#0b0817;--st:#2a2150}}
:root[data-theme="dark"]{--bg:#110d22;--pn:#1a1433;--pn2:#251d47;--ln:#3a2f66;--tx:#eee9ff;--mu:#a79fce;--ac:#a98bff;--ac2:#ff6fb5;--cd:#0b0817;--st:#2a2150}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}

header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.brand{font-weight:800;font-size:23px;letter-spacing:-.03em}
.brand b{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mu)}
.bar{width:150px;height:8px;background:var(--pn2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .5s}
.ib{border:1px solid var(--ln);background:var(--pn2);border-radius:10px;padding:6px 10px}
.wrap{flex:1;display:grid;grid-template-columns:370px 1fr;min-height:0}
aside{display:flex;flex-direction:column;min-height:0;background:var(--pn);border-right:1px solid var(--ln)}
.sh{padding:12px;display:grid;gap:10px;border-bottom:1px solid var(--ln)}
#q{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px}
.chip{flex:none;border:1px solid var(--ln);background:none;border-radius:99px;padding:4px 11px;font-size:13px;color:var(--mu)}
.chip.on{background:var(--ac);color:var(--pn);border-color:var(--ac)}
#list{flex:1;overflow:auto;padding:6px}
.it{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:9px 10px;border:0;border-radius:10px;background:none;content-visibility:auto;contain-intrinsic-size:auto 52px}
.it:hover{background:var(--pn2)}.it.on{background:var(--pn2);box-shadow:inset 3px 0 0 var(--ac)}
.it span{flex:1;font-weight:600;line-height:1.25}
.it small{display:block;color:var(--mu);font-weight:400;font-size:12px;margin-top:2px}
.tick{color:var(--ac);font-weight:800;visibility:hidden}.it.done .tick{visibility:visible}
.empty{padding:30px 14px;text-align:center;color:var(--mu)}
main{position:relative;overflow:auto;min-height:0}
#sp{position:sticky;top:0;height:3px;width:0;background:var(--ac2);z-index:5}
.dt{max-width:900px;margin:0 auto;padding:24px 22px 70px}
.hero{padding:70px 24px;text-align:center;color:var(--mu);max-width:560px;margin:0 auto;line-height:1.55}
.hero h2{font-size:32px;font-weight:800;color:var(--tx);letter-spacing:-.03em;margin-bottom:10px}
h1{font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.1;letter-spacing:-.035em;margin:6px 0 8px}
.desc{color:var(--mu);margin-bottom:14px;line-height:1.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.btn{border:1px solid var(--ln);background:var(--pn);border-radius:10px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--ac)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--pn)}
.btn.ok{border-color:var(--ac);color:var(--ac)}
.btn.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
#pv{border-radius:14px;border:1px solid var(--ln);margin-bottom:14px;overflow:hidden}
textarea#ed,pre#hh{width:100%;min-height:230px;background:var(--cd);color:var(--ct);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;font:400 14px/1.6 'JetBrains Mono',monospace;resize:vertical;tab-size:2;white-space:pre;overflow:auto;margin-bottom:12px}
pre#hh{display:none;min-height:0}
.note{font-size:13px;color:var(--mu);margin:-4px 0 12px}
.nv{display:flex;justify-content:space-between;margin-top:18px}
.back{display:none}
.top{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;border:0;background:var(--ac);color:var(--pn);font-size:18px;opacity:0;pointer-events:none;transition:opacity .25s}
.top.on{opacity:1;pointer-events:auto}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;font-weight:600;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){
 .wrap{display:block;position:relative}aside{height:100%;border:0}
 main{position:absolute;inset:0;transform:translateX(100%);transition:transform .3s;background:var(--bg);z-index:6}
 body.sel main{transform:none}.back{display:inline-flex}
 .prog{margin-left:0;width:100%}.bar{flex:1}
}
@media(prefers-reduced-motion:reduce){main,.bar i{transition-duration:.01ms!important}}
#out{background:var(--cd);color:var(--ct);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;font:400 14px/1.6 "JetBrains Mono",monospace;min-height:60px;white-space:pre-wrap;overflow:auto;margin-bottom:12px}.cmd{display:flex;gap:8px;align-items:center;margin-bottom:12px}.cmd code{flex:1;background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;font:400 13px "JetBrains Mono",monospace;overflow-x:auto;white-space:nowrap}
</style>
</head>

function nav(d){const a=L(),k=a.findIndex(x=>x.id==cur.id),m=a[k+d];if(m){show(m.id,1);const b=document.querySelector(`.it[data-id="${m.id}"]`);if(b)b.scrollIntoView({block:'nearest'})}else toast(d>0?'That was the last example':'This is the first example')}
function learned(){const i=cur;done.has(i.id)?done.delete(i.id):done.add(i.id);st.set('nxj_done',[...done].join(','));counts();
 const b=$('lr');b.classList.toggle('ok',done.has(i.id));b.textContent=done.has(i.id)?'✓ Learned':'Mark as learned';
 const it=document.querySelector(`.it[data-id="${i.id}"]`);if(it)it.classList.toggle('done',done.has(i.id));toast(done.has(i.id)?'Saved to your progress':'Removed from learned')}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.c!==undefined){cat=t.dataset.c;chips();list()}
 else if(t.classList.contains('it'))show(t.dataset.id,1);
 else if(t.id=='run')run();
 else if(t.id=='rs'){$('ed').value=cur.code;toast('Code reset')}
 else if(t.id=='cp')copy($('ed').value,'Copied code');
 else if(t.id=='cps')copy(S[cur.cat],'Copied command');
 else if(t.id=='lr')learned();
 else if(t.id=='nx')nav(1);else if(t.id=='pvb')nav(-1);
 else if(t.id=='bk'){document.body.classList.remove('sel');try{history.replaceState(null,'',location.pathname)}catch(e){}}
 else if(t.id=='rnd'){const p=IT[Math.floor(Math.random()*IT.length)];cat='All';chips();list();show(p.id,1);const b=document.querySelector(`.it[data-id="${p.id}"]`);if(b)b.scrollIntoView({block:'center'});toast('Random pick: '+p.ti)}
 else if(t.id=='top')$('main').scrollTop=0;
 else if(t.id=='th'){const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dk?'light':'dark';st.set('nxj_theme',d.dataset.theme)}});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value.trim().toLowerCase();list()}});
$('main').addEventListener('scroll',()=>{const m=$('main');$('sp').style.width=(m.scrollTop/Math.max(1,m.scrollHeight-m.clientHeight)*100)+'%';$('top').classList.toggle('on',m.scrollTop>400)});
const th=st.get('nxj_theme','');if(th)document.documentElement.dataset.theme=th;
function route(){const h=location.hash.slice(1);if(IT.some(i=>i.id==h))show(h,0)}
counts();chips();list();addEventListener('hashchange',route);route();
</script>
